<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livros - Ias e Tata</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="batmanFundo" class="batman-fundo">
    <div class="batman"></div>
    <div class="spiderman">
      <div class="spiderman-cabeca"></div>
    </div>
  </div>
    <div class="livro-decorativo livro-2"></div>
    <div class="livro-decorativo livro-3"></div>
    <div class="livro-decorativo livro-4"></div>
    <div class="livro-decorativo livro-5"></div>
    <div class="livro-decorativo livro-6"></div>
    <div class="livro-decorativo livro-7"></div>
    <div class="livro-decorativo livro-8"></div>

    <header>
      <nav>
        <a href="../index.html">Home</a>
        <a href="livros.html">Livros</a>
        <a href="lugares.html">Lugares</a>
        <button class="botao-tema" onclick="alternarTemaHomemFerro()" aria-label="Mudar tema">
          <span class="reator"></span>
        </button>
        <button class="botao-tema botao-capitao" onclick="alternarTemaCapitaoAmerica()" aria-label="Mudar tema Capitão América">
          <span class="escudo-capitao"></span>
        </button>
      </nav>
    </header>

  <main>
    <h1>Livros Da Diva</h1>
    <section class="caixa">
      <h2>Adicionar livro</h2>
      <input type="text" id="nomeLivro" placeholder="Nome do livro">

      <select id="tipoLivro">
        <option value="lidos">Livro que já li</option>
        <option value="queroLer">Livro que quero ler</option>
      </select>

      <button onclick="adicionarLivro()">Adicionar</button>
    </section>

    <section class="listas">
      <div class="caixa">
        <h2>Livros que já li</h2>
        <ul id="listaLidos"></ul>
      </div>

      <div class="caixa">
        <h2>Livros que quero ler</h2>
        <ul id="listaQueroLer"></ul>
      </div>
    </section>
  </main>

  <script src="../js/script.js"></script>
</body>
</html>
